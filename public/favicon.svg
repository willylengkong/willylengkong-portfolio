<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Dark Rounded App Squircle Background -->
  <rect width="512" height="512" rx="112" fill="#0a0a0a" />
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#27272a" stroke-width="12" />

  <!-- Willy Favicon Monogram (Pillars & Data Bar) -->
  <g transform="translate(120, 88) scale(7)">
    <!-- Bar 1 (Left Pillar, White) -->
    <rect x="0" y="0" width="11" height="48" rx="0.5" fill="#ffffff" />

    <!-- Bar 2 (Center Slanted Bar, White matching outer pillars) -->
    <polygon points="14,18 25,22 25,46 14,42" fill="#ffffff" />

    <!-- Bar 3 (Right Pillar, White) -->
    <rect x="28" y="0" width="11" height="48" rx="0.5" fill="#ffffff" />
  </g>
</svg>