<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Dark Rounded App Squircle Background -->
  <rect width="512" height="512" rx="128" fill="#0a0a0a" />
  <rect x="8" y="8" width="496" height="496" rx="120" stroke="#27272a" stroke-width="16" />
  
  <!-- Willy Lengkong Monogram Logo (Scaled 4x & Centered) -->
  <g transform="translate(92, 164) scale(4)">
    <!-- Bar 1 (Leftmost Column) -->
    <rect x="0" y="1" width="11" height="44" rx="0.5" fill="#ffffff" />
    
    <!-- Bar 2 (Slanted Column) -->
    <polygon points="15,18 25,21 25,45 15,42" fill="#ffffff" />
    
    <!-- Bar 3 (Middle Column) -->
    <rect x="29" y="1" width="10" height="44" rx="0.5" fill="#ffffff" />
    
    <!-- Bar 4 - Top Accent (Theme Accent Blue) -->
    <polygon points="43,0 53,4 53,13 43,9" fill="#3b82f6" />
    
    <!-- Bar 4 - Bottom Column -->
    <rect x="43" y="16" width="10" height="29" rx="0.5" fill="#ffffff" />
    
    <!-- Bar 5 - Top Column -->
    <rect x="57" y="1" width="10" height="31" rx="0.5" fill="#ffffff" />
    
    <!-- Bar 5 - Bottom Foot of 'L' Accent (Theme Accent Blue) -->
    <rect x="57" y="35" width="25" height="10" rx="0.5" fill="#3b82f6" />
  </g>
</svg>